<style>
:root{
 --ink:#14221f;--mur:#1E3A34;--mur2:#2a4d45;--kagit:#fdfcf9;--masa:#e6ebe9;--cizgi:#d3dbd7;--soluk:#5d6d67;
 --g:#2E7D4F;--y:#D98A00;--kirmizi:#C8453B;--mavi:#3D5BD1;--zemin:#f1f4f3;
 --c-aile:#B5446E;--c-bakim:#1B8A9A;--c-iletisim:#3D5BD1;--c-surdur:#3F8F3A;--c-yarat:#7A4FB5;
 --f:'Public Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--fb:'Bricolage Grotesque','Public Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 var(--f);background:var(--zemin);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--fb);letter-spacing:-.01em;line-height:1.2}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--mur);color:#e8f0ed;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 0 14px}
.brand{padding:0 20px 14px;cursor:pointer}.brand b{display:block;font:700 19px/1.15 var(--fb);color:#fff}
.brand span{display:block;font-size:12.5px;color:#a9c1b9;margin-top:4px}
.sw{display:flex;flex-direction:column;gap:2px;padding:0 12px 10px;margin-bottom:6px;border-bottom:1px solid #ffffff1f}
.sw button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;color:#bcd0c9;cursor:pointer;font-size:14px}
.sw button.on{background:#ffffff1c;color:#fff;font-weight:600}
.nav{display:flex;flex-direction:column;padding:4px 12px;overflow:auto;flex:1}
.nav button{background:none;border:0;text-align:left;padding:9px 12px;color:#cfe0da;cursor:pointer;border-left:3px solid transparent;border-radius:0 8px 8px 0;margin-left:-12px;padding-left:21px;font-size:14.5px}
.nav button:hover{background:#ffffff0f}
.nav button.on{border-left-color:#f1b24a;background:#ffffff17;color:#fff;font-weight:600}
.me{padding:12px 20px 0;border-top:1px solid #ffffff1f;font-size:13px;color:#a9c1b9}
.me b{display:block;color:#fff;font-weight:600;font-size:14px}
.me .row{margin:8px 0 0}.me .lb{background:#ffffff14;border:0;color:#e8f0ed;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}.me .lb:hover{background:#ffffff26}
.sync{font-size:12px}
.main{padding:26px 34px 60px;min-width:0;max-width:1240px}
.main>h2.pt{margin:0 0 16px;font-size:26px}
.tabs,.bar2,.seg{font-size:14px}
.bar2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--cizgi);padding:9px 14px;border-radius:12px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--cizgi);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-size:14px}.seg button.on{background:var(--mur);color:#fff}
.card{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h4{margin:2px 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.btn{background:var(--mur);color:#fff;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--mur2)}.btn.o{background:#b4690c}.btn.o:hover{background:#9a5909}
.btn.x{background:#fff;color:var(--kirmizi);border:1px solid var(--kirmizi)}.btn.g{background:#fff;color:var(--mur);border:1px solid var(--mur)}
.btn.s{padding:4px 11px;font-size:13px}.btn[disabled]{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--mavi);cursor:pointer;text-decoration:underline;padding:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.mut{color:var(--soluk);font-size:13px}
.empty{padding:34px;text-align:center;color:var(--soluk);background:#fff;border:1px dashed var(--cizgi);border-radius:12px}
input,select,textarea{border:1px solid #bcc8c3;border-radius:8px;padding:7px 9px;background:#fff;max-width:100%}
textarea{width:100%;min-height:60px;margin-top:6px}
.chk{display:flex;gap:6px;align-items:center}
.pl.done{border-left:5px solid var(--g)}.pl:not(.done){border-left:5px solid var(--y)}
.pl-h{display:flex;justify-content:space-between;gap:8px}.ay{font-weight:700;color:var(--mur)}
.tag{background:#e3eeea;color:var(--mur);border-radius:10px;padding:1px 9px;font-size:12.5px}
.gun{color:#8a5a00;font-size:13.5px}
.dt{background:#f6f3e4;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:13.5px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--cizgi);padding:6px 9px;text-align:left;vertical-align:top;font-size:14px}
th{background:#edf2f0;font-weight:600}
.scr{overflow-x:auto}
.two{display:grid;grid-template-columns:240px 1fr;gap:14px}
.sl{display:flex;gap:6px;width:100%;text-align:left;background:#fff;border:1px solid var(--cizgi);border-radius:9px;padding:7px 10px;margin-bottom:4px;cursor:pointer;align-items:center}
.sl.on{border-color:var(--mur);background:#eaf2ef}.sl i{margin-left:auto;font-style:normal;font-size:12px;color:var(--soluk)}.sl span{color:var(--soluk);min-width:22px}
.sk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--cizgi)}.sk>span{flex:1}
.chip{border:1px solid var(--cizgi);background:#fff;border-radius:16px;padding:3px 13px;cursor:pointer;font-size:13px}
.chip.g.on{background:var(--g);color:#fff;border-color:var(--g)}.chip.y.on{background:var(--y);color:#fff;border-color:var(--y)}
.cell{width:100%;border:1px solid var(--cizgi);background:#fff;padding:5px;cursor:pointer;border-radius:6px;min-width:84px}
.cell.g{background:var(--g);color:#fff}.cell.y{background:var(--y);color:#fff}
.catt{font-weight:700;color:var(--mur);margin-top:14px;font-size:16px;font-family:var(--fb)}
.bar{background:#dce2df;border-radius:6px;height:16px;position:relative;min-width:90px}.bar i{display:block;height:100%;background:var(--g);border-radius:6px}.bar b{position:absolute;inset:0;text-align:center;font-size:11.5px;line-height:16px}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;background:#e8ecea}.badge.yap{background:#d4ecdc;color:#17603a}.badge.ert{background:#fbe6bd;color:#7a4b00}
.warn{background:#fff4d6;border:1px solid #efd58a;border-radius:9px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.kv{display:flex;gap:10px;flex-wrap:wrap}.kv>div{flex:1;min-width:200px}
.big{font-size:28px;font-weight:800;color:var(--mur);font-family:var(--fb)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16211e;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;max-width:90vw}
.toast.err{background:var(--kirmizi)}
.modal{position:fixed;inset:0;background:#0a1412aa;display:flex;align-items:center;justify-content:center;z-index:50}.modal .card{max-width:450px;width:92%;margin:0}
.modal input,.login input,.login select{width:100%;margin:4px 0 12px;padding:10px}
/* giriş */
.lg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100vh}
.lg-l{background:var(--mur);color:#e8f0ed;padding:54px 48px;display:flex;flex-direction:column;justify-content:space-between}
.lg-l h1{font-size:40px;color:#fff;margin:0 0 14px;max-width:11em}.lg-l p{max-width:30em;color:#b9cfc7;margin:0 0 8px}
.lg-l ul{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}.lg-l li{padding-left:14px;border-left:3px solid #f1b24a;color:#dbe8e3;font-size:14.5px}
.lg-l small{color:#8faea4}
.lg-r{display:flex;align-items:center;justify-content:center;padding:30px}
.lg-f{width:100%;max-width:400px}.lg-f h2{font-size:24px;margin:0 0 4px}
.lg-f label{font-size:13.5px;font-weight:600}
.lg-f .seg{width:100%;margin:14px 0}.lg-f .seg button{flex:1}
.lg-f .btn{width:100%;padding:11px}
/* rapor merkezi */
.rc{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.rc-p{background:#fff;border:1px solid var(--cizgi);border-radius:14px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}

.rc-p .seg{width:100%}.rc-p .seg button{flex:1}
.kind{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--cizgi);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.kind b{display:block;font-size:14.5px}.kind span{font-size:12.5px;color:var(--soluk)}
.kind.on{border-color:var(--mur);box-shadow:inset 4px 0 0 var(--mur);background:#f0f6f3}
.pick{max-height:230px;overflow:auto;border:1px solid var(--cizgi);border-radius:9px;padding:4px 10px}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px;border-bottom:1px dashed #e3e9e6}
.pick label:last-child{border:0}
.rc-p select{width:100%}
.desk{background:var(--masa);border-radius:14px;padding:16px;min-height:60vh}
.desk-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;z-index:2;background:var(--masa);padding-bottom:10px}
.desk-bar .sp{margin-left:auto}
.sheets{display:flex;flex-direction:column;align-items:center;gap:20px}
.sheet{background:var(--kagit);width:100%;max-width:210mm;min-height:200mm;padding:11mm 12mm;box-shadow:0 1px 2px #0003,0 8px 24px #0002;color:#1d2623;overflow:hidden}
.more{font-size:13px;color:var(--soluk);text-align:center}
/* rapor sayfaları (önizleme + yazdırma) */
.rp-page{font:12px/1.4 Arial,Helvetica,sans-serif;color:#1d2623;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rp-page table{width:100%;border-collapse:collapse;background:transparent}
.rp-page th{background:#EAF0EE;border:1px solid #b9c4c0;padding:4px 6px;font-size:10.5px;color:#1E3A34;text-align:left;font-weight:700}

.rp-band{background:#1E3A34;color:#fff;padding:9px 12px;margin:0 0 10px}.rp-band b{display:block;font-size:13.5px}.rp-band span{font-size:10px;color:#cfe1da}
.rp-page h1{font:700 18px/1.2 var(--fb);color:#1E3A34;margin:10px 0 2px}.rp-sub{color:#58675f;font-size:11.5px;margin-bottom:8px}

.rp-kpi div{text-align:center;padding:8px 4px;border-right:1px solid #cfd8d4}.rp-kpi div:last-child{border:0}
.rp-kpi b{display:block;font:700 20px/1.1 var(--fb);color:#1E3A34}.rp-kpi span{font-size:9.5px;color:#58675f}
.stk{display:flex;height:11px;background:#DCE2DF;width:100%}.stk i{display:block;height:100%}.stk .g{background:#2E7D4F}.stk .y{background:#D98A00}
.stk.b{height:9px}.stk.b i{background:#3D5BD1}
.rp-page .k{text-align:center;width:52px}.rp-page .m{color:#58675f;font-size:10px}
.rp-page .ok{background:#e3f2e8;color:#1f6b40;font-weight:700;text-align:center}.rp-page .yo{background:#fdf0d4;color:#8a5a00;font-weight:700;text-align:center}.rp-page .bs{color:#97a39d;text-align:center}
.rp-page .not{background:#f6f8f7;font-size:10.5px}
.rp-imza{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:30px;font-size:11.5px}
.rp-ft{color:#7b8a83;font-size:9.5px;margin-top:12px}
.ek4,.pp{font-family:'Times New Roman',serif;color:#000}

.pp h2{text-align:center;font-size:14px}.pp table td,.pp table th{border:1px solid #000;font-size:11px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cardp{border:1px dashed #000;padding:8px;font-size:13px}
#printArea{display:none}
@media(max-width:1000px){.rc{grid-template-columns:1fr}.rc-p{position:static;max-height:none}.lg{grid-template-columns:1fr}.lg-l{padding:30px 24px}.lg-l h1{font-size:30px}}

}
</style>

function diff(){const R=toRecs(),ops=[];

  Object.keys(old).forEach(k=>{if(!(k in cur))ops.push({t,k,del:1})})});
 return ops}

async function flush(){
 if(INFLIGHT||!SES)return;
 const ops=diff();if(!ops.length){setSync('ok');return}
 INFLIGHT=true;setSync('saving');let reload=false;const reasons=[];
 try{
  for(let i=0;i<ops.length;i+=300){
   const ch=ops.slice(i,i+300);
   const r=await call('esitle',SES.token,ch.map(o=>({t:o.t,k:o.k,v:o.v,del:o.del})));
   ch.forEach(o=>{const m=SHADOW[o.t]=SHADOW[o.t]||{};if(o.del)delete m[o.k];else m[o.k]=o.j});
   (r.red||[]).forEach(x=>reasons.push(x.neden));
   if(r.yenile)reload=true}
  INFLIGHT=false;
  if(reasons.length){toast('Reddedildi: '+reasons[0]+(reasons.length>1?' (+'+(reasons.length-1)+')':''),'err');await pull(true)}
  else if(reload)await pull(true);
  else setSync('ok');
  if(SES&&diff().length)schedule(900)
 }catch(e){INFLIGHT=false;if(e.message==='OTURUM_BITTI')return endSession('Oturum süresi doldu. Lütfen yeniden giriş yapın.');setSync('err');toast('Kaydedilemedi: '+e.message,'err');schedule(6000)}}

 [/iş bölümü/,'Evdeki işlere (sofra kurma, odasını toplama gibi) yardım ediyor mu?',null],
 [/haftalık plan/,'Haftalık planına (ders, oyun, görevler) uymaya çalışıyor mu?',null],

 [/iletişim/,'Düşüncelerini ve isteklerini sizinle açıkça paylaşıyor mu?',null],

/* ===== Veli haftalık rehber: etkinlik başına 1. hafta / 2. hafta önerisi + kısa bilgi notları ===== */
const VELI_REHBER={
'Etkili İletişim Becerileri Geliştirme':{h1:'Her gün telefonsuz, ekransız 10 dakika sohbet edin. “Bugün ne öğrendin?” yerine “Bugün seni en çok ne güldürdü, en çok ne zorladı?” diye sorun. Çocuğunuz konuşurken sözünü kesmeyin; duyduğunuzu kendi sözlerinizle tekrar edin (“Yani canın sıkıldı, öyle mi?”).',h2:'Bir anlaşmazlığı birlikte “Ben dili” ile konuşun: “… olduğunda … hissediyorum, çünkü …”. Çocuğunuzdan da aynı cümle kalıbını kullanmasını isteyin. Sakin kalabildiği her seferde bunu fark edip söyleyin.',bil:['Çocuklar öğüt dinlemekten çok, kendilerini dinlenmiş hissettiklerinde açılır.','Suçlayan cümleler (“sen hep…”) yerine duyguyu anlatan cümleler tartışmayı kısaltır.','Konuşma sırasında telefon kullanmamak, en güçlü örnek olmanızı sağlar.']},
'Zaman Yönetimi Becerileri Kazanma':{h1:'Çocuğunuzla bir haftalık çizelge çizin: ders, oyun, dinlenme, ev görevi. Çizelgeyi kendisi yapsın, siz yalnızca soru sorun. Her akşam yaptıklarını kendisi işaretlesin.',h2:'Çizelgede neyin tuttuğuna, neyin tutmadığına birlikte bakın ve bir şeyi değiştirin. Ödeve başlama saatini sabitleyin; başlamadan önce “bugün kaç iş var, hangisi önce?” diye sorun.',bil:['Küçük işlerden başlamak (20 dakikalık ders blokları + kısa mola) uzun saatlerden daha etkilidir.','Çizelgeyi çocuk kendisi hazırlarsa uymaya daha istekli olur.','Hatırlatma yerine “şimdi sırada ne var?” sorusu sorumluluğu çocuğa bırakır.']},
'Ağız ve Diş Sağlığını Koruma':{h1:'Sabah kahvaltıdan sonra ve akşam yatmadan önce dişleri birlikte fırçalayın; süreyi telefondan değil, 2 dakikalık bir sayaçla veya şarkıyla tutun. Fırçanın yumuşak kıllı olduğunu ve macunun bezelye tanesi kadar olduğunu kontrol edin. Fırçalamayı her gün aynı saatte yaptırın.',h2:'Bu hafta diş ipini deneyin (günde bir kez, tercihen akşam). Dişlerin her yüzünü (ön, arka, çiğneme yüzü) ve dili de fırçalamayı hatırlatın. Evdeki şekerli atıştırmalıkları meyve, süt, yoğurt, ceviz gibi seçeneklerle değiştirin.',bil:['Dişler günde 2 kez, en az 2 dakika fırçalanmalıdır; fırça 3 ayda bir (kılları bozulunca daha erken) yenilenir.','Fırçalamadan sonra ağzı bol suyla çalkalamak yerine fazla köpüğü tükürmek, florürün dişte kalmasına yardım eder.','Asitli içecek ve meyve suyundan hemen sonra fırçalamak yerine yaklaşık 30 dakika beklemek mineyi korur.','Ağrı olmasa da yılda en az bir kez (tercihen 6 ayda bir) diş hekimi kontrolü önerilir.']},
'Gıda İsrafının Önlenmesi':{h1:'Bir hafta boyunca evde çöpe giden yemek, ekmek ve meyveyi çocuğunuzla birlikte not edin (neyi, ne kadar). Çocuğunuz kendi tabağına ihtiyacı kadar koysun; “önce az al, gerekirse tekrar al” kuralını deneyin.',h2:'Buzdolabını birlikte “önce bunu tüketelim” rafı ile düzenleyin. Artan yemekten yeni bir tarif (ekmek dilimlerinden kruton, olgun muzdan kek vb.) hazırlayın. Hafta sonunda ilk haftayla karşılaştırın.',bil:['Evlerde en çok ekmek, sebze-meyve ve pişmiş yemek israf edilir.','Alışveriş öncesi liste yapmak ve buzdolabına bakmak israfı belirgin azaltır.','Çocukla birlikte porsiyon ayarlamak, sofrada “tabağını bitir” baskısından daha öğreticidir.']},
'Finansal Sorumluluk ve Harcama Planı Yapma':{h1:'Çocuğunuzla küçük bir alışveriş listesi hazırlayın ve bir üst limit koyun. Alışverişte listeye bağlı kalmasını isteyin; sonunda fişi birlikte toplayın. Aile gelirinizi paylaşmanız gerekmez.',h2:'Çocuğunuz kendi harçlığı (varsa) veya hayali bir 100 TL ile “ihtiyaç mı, istek mi?” listesi yapsın. Bir hedef belirleyin (örn. bir kitap) ve haftalık küçük bir kumbara payı ayırın.',bil:['“İhtiyaç” ile “istek” ayrımı finansal okuryazarlığın ilk adımıdır.','Karar vermeden önce bir gün beklemek, anlık alışverişi azaltır.','Aile bütçenizin ayrıntısı çocuğa anlatılmaz; amaç düşünme alışkanlığıdır.']},
'Hoşgörü ve Farklılıklara Saygı':{h1:'Aile içinde farklı fikirlerin (örn. yemek, oyun, tatil tercihi) nasıl konuşulduğuna dikkat edin; çocuğunuzun görüşünü sorun ve söz hakkı verin. Bir yakınınızdan veya komşunuzdan hoşunuza giden bir geleneği anlatın.',h2:'Farklı bir kültürden bir yemek, masal veya oyun birlikte keşfedin. Gördüğünüz bir önyargılı sözü (“onlar hep…”) çocuğunuzla “Gerçekten öyle mi? Başka nasıl olabilir?” diye konuşun.',bil:['Çocuklar saygıyı en çok evdeki davranışlardan öğrenir.','Farklı olanı eleştirmeden önce merak etmek ve soru sormak yeterli bir başlangıçtır.','Alay ve dışlama davranışını fark ettiğinizde sakince, o an müdahale etmek en etkilisidir.']},
'Enerji Tasarrufu ve Bilinci':{h1:'Çocuğunuzla “kapatma turu” yapın: kullanılmayan ışık, TV, şarj aleti, açık bırakılmış musluk. Akşam bir tur, sabah bir tur atın ve çocuğunuzu “tasarruf görevlisi” yapın.',h2:'Elektrik veya su sayacına birlikte bakın; hafta başı ve sonu değeri not edin. Tasarruf için bir kural belirleyin (örn. diş fırçalarken musluğu kapatmak, çamaşır makinesini dolu çalıştırmak).',bil:['Kullanılmayan cihazların bekleme modunda enerji harcadığını çocuğunuzla konuşun.','Diş fırçalarken musluğu kapatmak günde birkaç litre su kazandırır.','LED ampuller klasik ampullere göre çok daha az enerji kullanır.']},
'Bireysel ve Grup Hedefleri Belirleme':{h1:'Çocuğunuzla bu hafta ulaşabileceği küçük bir hedef yazın (örn. “her gün 15 dakika kitap okumak”). Hedef açık, ölçülebilir ve ulaşılabilir olsun; gün sonunda birlikte işaretleyin.',h2:'Bir de dönem sonu hedefi belirleyin ve ona götüren üç küçük adım yazın. Buzdolabı gibi görünür bir yere asın. Hedefe ulaşıldığında ödülü eşya değil, ortak bir etkinlik (piknik, oyun) yapın.',bil:['Büyük hedefleri küçük adımlara bölmek motivasyonu korur.','Hedefe ulaşamamak başarısızlık değil, planı gözden geçirme fırsatıdır.','Çaba ve ilerlemeyi övmek, yalnızca sonucu övmekten daha kalıcı etki yapar.']},
'Sağlıklı Uyku Düzeni ve Yatak Hijyenini Koruma':{h1:'Yatış ve kalkış saatini her gün (hafta sonu da yakın saatlerde) sabitleyin. Yatmadan 1 saat önce ekranları kapatın; yerine kitap, sohbet veya sakin müzik koyun. Odanın serin ve karanlık olmasına dikkat edin.',h2:'Çocuğunuz sabahları yatağını kendisi toplasın. Çarşafın en az haftada bir, yastık kılıfının daha sık değiştirilmesini birlikte yapın. Uyku düzeninin sabah nasıl hissettirdiğini konuşun.',bil:['Okul çağındaki çocuklar için genellikle 9–11 saat uyku önerilir.','Yatmadan önce ekran ışığı uykuya dalmayı geciktirir.','Düzenli uyku dikkat, ruh hali ve derslerdeki başarıyı olumlu etkiler.']},
'Okul Eşyalarını Düzenleme':{h1:'Her akşam ertesi günün programına bakarak çantayı birlikte hazırlayın; sonra çocuğunuz tek başına yapsın, siz yalnızca kontrol edin. Kalem, defter, kitap için sabit bir yer belirleyin.',h2:'Ders masasını haftada bir birlikte toplayın: gereksizleri atın, defterleri ayırın. Çantada “eksik var mı?” kontrol listesi (birkaç madde) hazırlayıp çantanın kapağına koyun.',bil:['Hazırlığı akşamdan yapmak sabah telaşını azaltır.','Eşyaların sabit bir yeri olması “kaybettim” sorunlarını azaltır.','Çocuğun kendi çantasını hazırlaması sorumluluk duygusunu güçlendirir.']},
'Girişimcilik Fikirlerini Geliştirme':{h1:'Evde sizi veya çocuğunuzu rahatsız eden küçük bir sorun seçin (örn. dağınık ayakkabılık). Çocuğunuzdan bu sorun için üç farklı çözüm fikri isteyin; “saçma” demeden hepsini yazın.',h2:'Fikirlerden en uygulanabilir olanı seçin ve deneyin. Çalışmadıysa nedenini konuşup değiştirin. “Başka kimler bu sorunu yaşıyor olabilir?” sorusunu sorun.',bil:['Girişimcilik para kazanmaktan önce sorun fark etme ve çözüm üretme becerisidir.','Çok fikir üretmek iyi fikri bulma ihtimalini artırır; önce eleştirmeyin.','Denemek ve yanılmak sürecin parçasıdır.']},
'Sosyal Medya ve Dijital İletişim Bilinci Kazandırma':{h1:'Çocuğunuzla birlikte ekran süresi ve kullanım kurallarını (hangi saatlerde, hangi uygulamalar) yazın ve herkesin görebileceği yere asın. Kurallar sizi de kapsasın. Yemekte ve yatmadan önce ekran kapalı olsun.',h2:'Çocuğunuzla “Kişisel bilgi (adres, okul, telefon, fotoğraf) kimlerle paylaşılır?” konuşun. Tanımadığı biriyle yazışırsa veya rahatsız edici bir şey görürse size söylemesinin her zaman güvenli olduğunu belirtin; cezalandırmayacağınızı vurgulayın.',bil:['Yaşa uygun içerik ve uygulamalar için ebeveyn denetimi ayarlarını birlikte açın.','Paylaşılan her fotoğraf ve yazının uzun süre internette kalabileceğini anlatın.','Siber zorbalığa maruz kalan veya tanık olan çocuğun bunu bir yetişkinle paylaşması öğretilmelidir.']},
'Vücut Sağlığı ve Beslenme İlişkisi':{h1:'Her öğünde sofrada bir sebze veya meyve bulundurun; çocuğunuz tabağındaki renkleri saysın. Kahvaltıyı atlamamasına dikkat edin ve su içmeyi hatırlatın (yanında su şişesi taşısın).',h2:'Haftada en az üç gün 30 dakika birlikte yürüyüş, bisiklet veya oyun planlayın. Paketli, şekerli atıştırmalık yerine meyve, kuru yemiş veya yoğurt koyun. Etiket okumayı birlikte deneyin.',bil:['Okul çağındaki çocuklar için günde yaklaşık 60 dakika hareket önerilir; bu birkaç parçaya bölünebilir.','Tabağın yarısının sebze-meyve olması dengeli beslenmenin pratik bir ölçüsüdür.','Çocuğun yemek hazırlığına katılması yeni besinleri denemesini kolaylaştırır.']},
'Sürdürülebilir Tarım ve Bahçecilik':{h1:'Bir saksıya (veya yumurta kolisine) fasulye, nane ya da fesleğen tohumu ekin; çocuğunuz etiketini yazsın ve ışık alan bir yere koysun. Her gün toprağın nemini parmakla kontrol etmesini isteyin.',h2:'Bitkinin gelişimini çizin veya fotoğraflayın, boyunu cetvelle ölçüp not edin. Yemek artığı (sebze kabuğu vb.) ile kompost fikrini konuşun; sulamayı gereğinden fazla yapmamayı (kök çürümesi) anlatın.',bil:['Fasulye, ışık ve nemle birkaç gün içinde filizlenir; çocuklar için hızlı sonuç verir.','Balkon veya pencere kenarı yeterlidir; büyük bahçe gerekmez.','Toprak nemi parmakla kontrol edilirse gereksiz sulama önlenir.']},
'Mutfak Güvenliği Konusunda Bilgi Edinme':{h1:'Çocuğunuzla mutfakta tehlikeleri birlikte “keşfedin”: sıcak tencere, ocak, bıçak, prizler, ıslak zemin. Her biri için tek bir kural koyun (örn. “tencere sapları içeri bakar”). Pişirirken yetişkin yanında olsun.',h2:'Yetişkin gözetiminde güvenli bir işi deneyin (örn. tereyağlı ekmek hazırlamak, sebze yıkamak). Yangın veya yanık durumunda ne yapılacağını (acil numara 112, yanığı soğuk akan suya tutma) birlikte tekrar edin.',bil:['Islak elle prize veya elektrikli aletlere dokunulmamalıdır.','Yağ yangınına su dökülmez; ocağı kapatıp üzerini kapakla örtmek gerekir.','Yanıkta soğuk (buz değil) akan suyla birkaç dakika soğutmak ilk yardım adımıdır.']},
'Fikirlerin Prototipini Oluşturma':{h1:'Çocuğunuzla bir fikrini (örn. kalemlik, oyuncak, düzenleyici) seçin ve kâğıda çizin. Evdeki karton, kutu, kapak gibi atık malzemeleri bir araya toplayın.',h2:'Çizimi basit bir modele dönüştürün. Bitince “Ne işe yaradı, neyi değiştirelim?” diye konuşun ve ikinci bir sürüm deneyin. Müdahale etmeden çocuğun yapmasına izin verin.',bil:['Prototip ilk denemedir; mükemmel olması gerekmez.','Atık malzeme kullanmak hem ekonomik hem çevre dostudur.','“Neyi geliştirebiliriz?” sorusu denemeyi ve düzeltmeyi öğretir.']},
'Biyoçeşitlilik ve Koruma':{h1:'Evin çevresinde 15 dakikalık “canlı avı” yapın: böcek, kuş, bitki, yosun. Bulduklarını (dokunmadan veya zarar vermeden) çizin ya da fotoğraflayın.',h2:'Bulduğunuz canlıların neden orada yaşadığını konuşun. Balkona kuşlar için su kabı koymak, çöp toplamak, doğaya zarar vermemek gibi küçük bir koruma eylemini birlikte yapın.',bil:['Biyoçeşitlilik; bir bölgedeki tüm canlıların çeşitliliğidir ve ekosistemin dengesi için önemlidir.','Doğada gözlem yaparken canlılara dokunmamak ve yuvaları bozmamak gerekir.','Küçük bir bahçe veya saksı bile böcekler ve kuşlar için yaşam alanı olabilir.']},
'Topluluk Önünde Konuşma Becerisi':{h1:'Çocuğunuz sevdiği bir konuda 2 dakikalık kısa bir konuşma hazırlasın (giriş, ana fikir, kapanış). Önce aynanın karşısında, sonra size anlatsın.',h2:'Aile önünde sunumu yapsın. Siz önce olumlu yanları (ses tonu, göz teması, akıcılık) söyleyin, sonra tek bir gelişim noktası önerin. Heyecanlandığında yavaş nefes almayı ve yavaş konuşmayı hatırlatın.',bil:['Heyecan doğaldır; tekrar yaptıkça azalır.','Not kartına anahtar kelimeler yazmak, ezber yapmaktan daha rahat sunum sağlar.','Eleştiriden önce olumlu geri bildirim vermek özgüveni korur.']}

 return `<div class="ek4"><div class="ek">Ek-4</div><h2>YAŞAM BECERİLERİ PROJESİ</h2><h3>GÖZLEM FORMU</h3><p><b>Öğrencinin Adı Soyadı:</b> ${esc(s.name)}</p><p><b>Sınıfı:</b> ${esc(c.name)} &nbsp;&nbsp;&nbsp; <b>Dönem:</b> ${ui.term}. dönem <span style="float:right"><b>Gözlem Tarihi:</b> ${fmt(o.date)}</span></p>`+
 CATS.map((cat,i)=>{const sk=S.skills[cat.k].length?S.skills[cat.k]:[{id:'-',t:''}];const cc=o.c[cat.k]||{s:{},v:'',o:''};
  return `<div class="catt">${i+1}. ${cat.n}</div><table><tr><th>Beceriler</th><th class="c">Gelişti</th><th class="c">Gelişiyor</th><th>Veli Notları</th><th>Öğretmen Notları</th></tr>`+sk.map((k,j)=>`<tr><td>${esc(k.t)}</td><td class="c">${cc.s[k.id]==='g'?'✓':''}</td><td class="c">${cc.s[k.id]==='y'?'✓':''}</td>${j===0?`<td rowspan="${sk.length}">${esc(cc.v)}</td><td rowspan="${sk.length}">${esc(cc.o)}</td>`:''}</tr>`).join('')+'</table>'}).join('')+
 `<p><b>Not:</b> <i>Veli notları</i> kısmına çocuğunuzun bu dönem içindeki genel gelişimi hakkında gözlemlerinizi ve geri bildirimlerinizi yazınız.</p></div>`}

 return `<div class="pp"><h2>${esc(S.meta.school.toLocaleUpperCase('tr-TR'))} MÜDÜRLÜĞÜ ${esc(S.meta.year)} EĞİTİM VE ÖĞRETİM YILI YAŞAM BECERİLERİ PROJESİ YILLIK FAALİYET PLANI</h2><p><b>${term}. DÖNEM</b></p><table><tr><th>AY</th><th>NO</th><th>KATEGORİ</th><th>ETKİNLİK (etkinlik kitabındaki adıyla)</th><th>BAĞLANTILI GÜN / HAFTA</th><th>UYGULAMA NOTU</th><th>TARİH / DURUM</th></tr>${items.map(p=>{const s=cid?st(cid,p.id):{};return `<tr><td>${esc(p.ay)}</td><td>${p.no}</td><td>${esc(catName(p.kat))}</td><td>${esc(p.etk)}</td><td>${esc(p.gun||'—')}</td><td>${esc(p.not)}</td><td>${s.date?fmt(s.date):'.../.../...'} ${s.done?'☒':'☐'} Yapıldı</td></tr>`}).join('')}</table></div>`}
function aeHtml(){return `<div class="pp"><h2>${esc(S.meta.school.toLocaleUpperCase('tr-TR'))} MÜDÜRLÜĞÜ<br>${esc(S.meta.year)} EĞİTİM VE ÖĞRETİM YILI AİLEMLE EĞİTİM YOLCULUĞUM YILLIK ETKİNLİK PLANI</h2><table><tr><th>AY</th><th>ETKİNLİK</th><th>YER</th><th>KATILIMCI KADEME</th><th>UYGULAMA NOTU</th><th>SORUMLU ÖĞRETMEN(LER)</th><th>TARİH / DURUM</th></tr>${S.aile.map(a=>`<tr><td>${esc(a.ay)}</td><td>${esc(a.etk)}</td><td>${esc(a.yer)}</td><td>${esc(a.kat)}</td><td>${esc(a.not)}</td><td>${esc(a.sorumlu)}</td><td>${a.date?fmt(a.date):'.../.../20...'} ${a.durum==='yap'?'☒':'☐'} Yapıldı ${a.durum==='ert'?'☒':'☐'} Ertelendi</td></tr>`).join('')}</table></div>`}
function csvObs(cid){const sep=';';const head=['No','Ad Soyad','Dönem'];CATS.forEach(c=>S.skills[c.k].forEach(k=>head.push(c.n+' - '+k.t)));
 const rows=[head];studs(cid).forEach(s=>['1','2'].forEach(t=>{const o=readObs(s.id,t);const r=[s.no,s.name,t];CATS.forEach(c=>S.skills[c.k].forEach(k=>{const v=((o.c[c.k]||{}).s||{})[k.id];r.push(v==='g'?'Gelişti':v==='y'?'Gelişiyor':'')}));rows.push(r)}));
 return '\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(sep)).join('\n')}

/* ============ RAPOR MERKEZİ (tekli + toplu) ============ */
const OKUL=()=>esc(String(S.meta.school||'').toLocaleUpperCase('tr-TR'));
const pc=(a,b)=>b?Math.round(a*100/b):0;
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function oz(sid,t){let tot=0,g=0,y=0,veli=false;const cats={};const o=readObs(sid,t);
 CATS.forEach(c=>{const rec=(o.c||{})[c.k]||{s:{}};let cg=0,cy=0;(S.skills[c.k]||[]).forEach(k=>{const v=(rec.s||{})[k.id];if(v==='g')cg++;else if(v==='y')cy++});
  if(veliVar(rec))veli=true;const n=(S.skills[c.k]||[]).length;cats[c.k]={g:cg,y:cy,n};tot+=n;g+=cg;y+=cy});
 return{tot,g,y,doluluk:pc(g+y,tot),gelisim:pc(g,tot),cats,veli}}
const stk=(g,y,n)=>`<div class="stk"><i class="g" style="width:${pc(g,n)}%"></i><i class="y" style="width:${pc(y,n)}%"></i></div>`;
const sbar=p=>`<div class="stk b"><i style="width:${p}%"></i></div>`;
const rpKpi=a=>`<div class="rp-kpi">${a.map(x=>`<div><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`;
const rpH=(t,col)=>`<div class="rp-h"${col?` style="border-left-color:${col}"`:''}>${esc(t)}</div>`;
const CCOL={aile:'#B5446E',bakim:'#1B8A9A',iletisim:'#3D5BD1',surdur:'#3F8F3A',yarat:'#7A4FB5'};
function rpPage(title,sub,body,sign){return `<section class="rp-page"><div class="rp-band"><b>${OKUL()} MÜDÜRLÜĞÜ</b><span>${esc(S.meta.year)} Eğitim-Öğretim Yılı · Yaşam Becerileri Projesi ve Ailemle Eğitim Yolculuğum</span></div><h1>${esc(title)}</h1><div class="rp-sub">${esc(sub)}</div>${body}${sign?`<div class="rp-imza">${sign.map(x=>`<div>${esc(x[0])}<br><br>${esc(x[1]||'')}</div>`).join('')}</div>`:''}<div class="rp-ft">Oluşturma: ${new Date().toLocaleString('tr-TR')}</div></section>`}
function catTable(tot){return `<table><tr><th style="width:34%">Kategori</th><th>Gelişti / Gelişiyor / Gözlenmedi</th><th class="k" style="width:62px">Gelişti</th></tr>${CATS.map(c=>{const x=tot[c.k];return `<tr><td><b style="color:${CCOL[c.k]}">■</b> ${esc(c.n)}</td><td>${stk(x.g,x.y,x.n)}</td><td class="k">%${pc(x.g,x.n)}</td></tr>`}).join('')}</table><div class="m">Yeşil: Gelişti · Sarı: Gelişiyor · Gri: gözlenmedi</div>`}
function catTotals(list,t){const tot={};CATS.forEach(c=>tot[c.k]={g:0,y:0,n:0});list.forEach(s=>{const z=oz(s.id,t);CATS.forEach(c=>{tot[c.k].g+=z.cats[c.k].g;tot[c.k].y+=z.cats[c.k].y;tot[c.k].n+=z.cats[c.k].n})});return tot}
function rpKarne(s,t){const c=clsById(s.cid)||{name:'',ogretmen:''};const z=oz(s.id,t),z1=oz(s.id,'1'),z2=oz(s.id,'2');const o=readObs(s.id,t);
 let b=`<table><tr><td><b>Öğrenci:</b> ${esc(s.name)}</td><td><b>Okul no:</b> ${esc(s.no)}</td><td><b>Sınıf:</b> ${esc(c.name)}</td><td><b>Dönem:</b> ${t}. dönem</td><td><b>Gözlem tarihi:</b> ${esc(fmt(o.date)||'—')}</td></tr></table>`;
 b+=rpKpi([['%'+z.gelisim,'Gelişti oranı'],['%'+z.doluluk,'Gözlem doluluğu'],[z.g,'Gelişti'],[z.y,'Gelişiyor'],[z.tot-z.g-z.y,'Gözlenmedi']]);
 b+=rpH('Kategori özeti')+`<table><tr><th style="width:34%">Kategori</th><th>Gelişti / Gelişiyor / Gözlenmedi</th><th class="k">G</th><th class="k">Y</th><th class="k">Beceri</th></tr>${CATS.map(k=>{const x=z.cats[k.k];return `<tr><td><b style="color:${CCOL[k.k]}">■</b> ${esc(k.n)}</td><td>${stk(x.g,x.y,x.n)}</td><td class="k">${x.g}</td><td class="k">${x.y}</td><td class="k">${x.n}</td></tr>`}).join('')}</table><div class="m">Yeşil: Gelişti · Sarı: Gelişiyor · Gri: henüz gözlenmedi</div>`;
 CATS.forEach(k=>{const rec=(o.c||{})[k.k]||{s:{},v:'',o:''};
  b+=rpH(k.n,CCOL[k.k])+`<table><tr><th>Beceri</th><th class="k" style="width:74px">Durum</th></tr>${(S.skills[k.k]||[]).map(x=>{const v=rec.s[x.id];return `<tr><td>${esc(x.t)}</td>${v==='g'?'<td class="ok">Gelişti</td>':v==='y'?'<td class="yo">Gelişiyor</td>':'<td class="bs">—</td>'}</tr>`}).join('')}${rec.o?`<tr><td colspan="2" class="not"><b>Öğretmen notu:</b> ${esc(rec.o)}</td></tr>`:''}${(rec.vy||rec.v)?`<tr><td colspan="2" class="not"><b>Veli görüşü:</b> ${esc(rec.vy||rec.v)}</td></tr>`:''}</table>`});
 b+=rpH('Dönemlere göre gelişim')+`<table><tr><th>Kategori</th><th class="k" style="width:90px">1. dönem</th><th class="k" style="width:90px">2. dönem</th></tr>${CATS.map(k=>{const a=z1.cats[k.k],d=z2.cats[k.k];return `<tr><td>${esc(k.n)}</td><td class="k">${a.g+a.y?'%'+pc(a.g,a.n):'—'}</td><td class="k">${d.g+d.y?'%'+pc(d.g,d.n):'—'}</td></tr>`}).join('')}<tr><td><b>Genel</b></td><td class="k"><b>${z1.g+z1.y?'%'+z1.gelisim:'—'}</b></td><td class="k"><b>${z2.g+z2.y?'%'+z2.gelisim:'—'}</b></td></tr></table>`;
 let en=null,az=null;CATS.forEach(k=>{const x=z.cats[k.k];if(!x.n||!(x.g+x.y))return;const p=x.g/x.n;if(!en||p>en.p)en={k,p};if(!az||p<az.p)az={k,p}});
 if(en)b+=rpH('Genel değerlendirme')+`<p>${esc(s.name)} için ${t}. dönemde en güçlü alan “${esc(en.k.n)}” olarak gözlenmiştir.${az&&az.k!==en.k?` Gelişimi desteklenmesi gereken alan “${esc(az.k.n)}” alanıdır.`:''}${z.y>=3?` “Gelişiyor” işaretli beceri sayısı ${z.y} olduğundan rehberlik ve aile desteği önerilir.`:''}</p>`;
 return rpPage('YAŞAM BECERİLERİ GELİŞİM KARNESİ',`${s.name} · ${c.name} · ${t}. dönem`,b,[['Sınıf Öğretmeni',c.ogretmen],['Okul Müdürü','']])}
function classStats(c,t){const ss=studs(c.id),zs=ss.map(s=>oz(s.id,t));const plan=S.plan.filter(p=>String(p.term)===String(t));const done=plan.filter(p=>st(c.id,p.id).done).length;
 return{ss,zs,plan,done,planP:pc(done,plan.length),dol:avg(zs.map(z=>z.doluluk)),gel:avg(zs.map(z=>z.gelisim)),veli:pc(zs.filter(z=>z.veli).length,ss.length),destek:ss.filter((s,i)=>zs[i].y>=3)}}
function rpSinif(c,t){const o=classStats(c,t);
 let b=rpKpi([[o.ss.length,'Öğrenci'],['%'+o.dol,'Gözlem doluluğu'],['%'+o.gel,'Gelişti oranı'],['%'+o.planP,'Plan uygulama'],['%'+o.veli,'Veli notu yazan']]);
 b+=rpH('Kategori bazında sınıf gelişimi')+catTable(catTotals(o.ss,t));
 b+=rpH('Öğrenci bazında gelişim')+`<table><tr><th class="k" style="width:30px">No</th><th>Öğrenci</th>${CATS.map(k=>`<th class="k" style="color:${CCOL[k.k]}">${esc(k.n.split(' ')[0])}<br>G / Y</th>`).join('')}<th style="width:80px">Doluluk</th><th class="k">Gelişti</th></tr>${o.ss.map((s,i)=>{const z=o.zs[i];return `<tr><td class="k">${esc(s.no)}</td><td>${esc(s.name)}</td>${CATS.map(k=>`<td class="k">${z.cats[k.k].g} / ${z.cats[k.k].y}</td>`).join('')}<td>${sbar(z.doluluk)}<span class="m">%${z.doluluk}</span></td><td class="k">%${z.gelisim}</td></tr>`}).join('')}</table>`;
 b+=rpH('Destek önerilen öğrenciler')+(o.destek.length?`<p>${o.destek.map(s=>esc(s.no+' '+s.name)).join(', ')}</p><div class="m">Ölçüt: “Gelişiyor” işareti 3 ve üzeri.</div>`:'<div class="m">Bu ölçüte uyan öğrenci yok.</div>');
 b+=rpH(`Faaliyet planı (${t}. dönem)`)+`<table><tr><th>Ay</th><th>Etkinlik</th><th>Kategori</th><th class="k" style="width:62px">Durum</th><th class="k" style="width:66px">Tarih</th></tr>${o.plan.map(p=>{const d=st(c.id,p.id);return `<tr><td>${esc(p.ay)}</td><td>${esc(p.etk)}</td><td>${esc(catName(p.kat))}</td><td class="${d.done?'ok':'bs'}">${d.done?'Yapıldı':'Bekliyor'}</td><td class="k">${esc(fmt(d.date))}</td></tr>`}).join('')}</table>`;
 return rpPage(c.name+' SINIFI DEĞERLENDİRME RAPORU',`${t}. dönem · ${c.ogretmen||''}`,b,[['Sınıf Öğretmeni',c.ogretmen],['Okul Müdürü','']])}
function rpMatris(c,t){const ss=studs(c.id),sk=[];CATS.forEach(k=>(S.skills[k.k]||[]).forEach(x=>sk.push({ck:k.k,id:x.id,t:x.t})));
 let b=`<div class="m">G: Gelişti · Y: Gelişiyor · boş: gözlenmedi. Sütun numaraları beceri anahtarındadır.</div><table><tr><th style="width:26px">No</th><th>Öğrenci</th>${sk.map((x,i)=>`<th class="k" style="width:22px;color:${CCOL[x.ck]}">${i+1}</th>`).join('')}<th class="k">%</th></tr>${ss.map(s=>{const z=oz(s.id,t),o=readObs(s.id,t);return `<tr><td class="k">${esc(s.no)}</td><td>${esc(s.name)}</td>${sk.map(x=>{const v=(((o.c||{})[x.ck]||{}).s||{})[x.id];return v==='g'?'<td class="ok">G</td>':v==='y'?'<td class="yo">Y</td>':'<td></td>'}).join('')}<td class="k">%${z.gelisim}</td></tr>`}).join('')}</table>`;
 b+=rpH('Beceri anahtarı')+`<table>${sk.map((x,i)=>`<tr><td class="k" style="width:26px;color:${CCOL[x.ck]}"><b>${i+1}</b></td><td>${esc(x.t)}</td><td style="width:42%">${esc(catName(x.ck))}</td></tr>`).join('')}</table>`;
 return rpPage(c.name+' BECERİ MATRİSİ',`${t}. dönem`,b,null)}
function rpAile(c){const ss=studs(c.id);
 let b=`<table><tr><th class="k" style="width:26px">No</th><th>Öğrenci</th>${S.aile.map((a,i)=>`<th class="k">${i+1}</th>`).join('')}<th class="k">Katılım</th></tr>${ss.map(s=>{let n=0;const h=S.aile.map(a=>{const k=S.attend[a.id+'|'+s.id]==='k';if(k)n++;return k?'<td class="ok">✓</td>':'<td></td>'}).join('');return `<tr><td class="k">${esc(s.no)}</td><td>${esc(s.name)}</td>${h}<td class="k">${n} / ${S.aile.length}</td></tr>`}).join('')}</table>`;
 b+=rpH('Etkinlik anahtarı')+`<table><tr><th class="k" style="width:26px">#</th><th>Etkinlik</th><th>Ay</th><th>Durum</th><th class="k">Katılan aile</th></tr>${S.aile.map((a,i)=>`<tr><td class="k">${i+1}</td><td>${esc(a.etk)}</td><td>${esc(a.ay)}</td><td>${a.durum==='yap'?'Yapıldı':a.durum==='ert'?'Ertelendi':'Planlandı'}</td><td class="k">${ss.filter(s=>S.attend[a.id+'|'+s.id]==='k').length} / ${ss.length}</td></tr>`).join('')}</table>`;
 return rpPage(c.name+' AİLEMLE EĞİTİM KATILIM RAPORU',S.meta.year||'',b,[['Sınıf Öğretmeni',c.ogretmen],['Rehber Öğretmen','']])}

function komutCoz(t0,c){
 const t=trl(t0).replace(/[’']/g,"'").replace(/\s+/g,' ').trim();if(!t)return null;
 const KATK={aile:['aile'],bakim:['bakım','hijyen','temizlik','diş'],iletisim:['iletişim','sosyal','arkadaş'],surdur:['sürdürülebilir','çevre','geri dönüşüm','enerji','israf','doğa'],yarat:['yaratıcı','girişim','proje','hedef']};
 const kats=Object.keys(KATK).filter(k=>KATK[k].some(w=>t.includes(w)));
 const ton=/gelişim odak|destek|geliştir/.test(t)?'gelisim':/olumlu|iyi|güzel|başarılı|övg/.test(t)?'olumlu':/dengeli/.test(t)?'dengeli':'otomatik';
 const over=/üzerine yaz|yeniden|hepsini yenile|tümünü yenile/.test(t);
 const words=t.split(' ').map(w=>w.replace(/'.*$/,''));
 const ogr=c?studs(c.id).find(s=>s.name.split(/\s+/).map(trl).some(n=>n.length>=3&&words.some(w=>w.startsWith(n)&&w.length<=n.length+4))):null;
 const hepsi=/(tüm|bütün|herkes|hepsi|sınıf)/.test(t);
 if(/veli/.test(t)&&/(takip|yazmayan|doldurmayan|eksik|kimler|durum)/.test(t))return{e:'git',tab:'takip',ad:'Veli takibi açıldı'};
 if(/(risk|öncelik|sıkıntı|destek (gerek|ihtiyaç)|dikkat edilmesi)/.test(t))return{e:'git',tab:'risk',ad:'Risk ve öncelik listesi açıldı'};
 if(/(rapor|karne|ek-?4|matris|pdf|yazdır)/.test(t)){
  let mode='toplu',kind='sinif';
  if(/karne/.test(t)){kind=ogr&&!hepsi?'karne':'karneler';mode=ogr&&!hepsi?'tekli':'toplu'}
  else if(/ek-?4/.test(t)){kind=ogr&&!hepsi?'ek4':'ek4lar';mode=ogr&&!hepsi?'tekli':'toplu'}
  else if(/matris/.test(t))kind='matris';
  else if(/aile/.test(t))kind='aile';

function lexHits(text,list){let t=' '+trl(text)+' ';
 t=t.replace(/(sorun|problem|şikâyet|şikayet|kavga|devamsızlık|olumsuzluk)\w*\s+(yok|yaşamıyor|görülmüyor|görülmedi|bulunmuyor)/g,' ').replace(/(sorun|problem)\w*\s+(çıkarmıyor|yaratmıyor)/g,' ');

const KL_TAKVIM=`<h3>Takvim ve Süreç: veli formunun açılma tarihleri</h3><p>Gözlem formunun veli bölümü her zaman açık değildir. <b>Takvim ve Süreç</b> sekmesinde her etkinliğin yanına veli formunun açık olacağı <b>tarih aralığı</b> girilir (sınıf öğretmeni kendi sınıfı için, idare tüm okul için varsayılan olarak). Tarih girilmezse <i>Otomatik</i> mod yıllık plana göre çalışır: ayda iki etkinlik varsa biri ayın 1–15’i, diğeri 16’sı–ay sonu açılır. Veli yalnızca açık alanı doldurur; kapalı alanlar kilitli görünür. İdare, modu <i>Otomatik / Yalnız elle / Kısıtlama yok</i> olarak değiştirebilir.</p><p><b>Veliye özel ek süre:</b> süresinde doldurmayan bir veliye yalnızca o beceri alanı için 7/15/30 gün (ya da seçtiğiniz tarihe kadar) ek süre verin; süre bitince form yeniden kapanır. <b>Uygulama tarih aralığı:</b> etkinlik yapıldığında “Yapıldı” işaretleyip başlangıç–bitiş tarihlerini girin (örn. ağız ve diş sağlığı 15 günlük gözlem). <b>Etkinlik / aylık rapor:</b> Raporlar → <i>Etkinlik / aylık rapor</i>. Toplu modda sınıf için seçtiğiniz etkinliğin (veya ayın tüm etkinliklerinin) raporu: kim formu doldurdu/gönderdi, velilerin cevapları, veli ve öğretmen notları, Ek-4 işaretleri, dolduran/doldurmayan listesi. Tekli modda seçtiğiniz öğrencinin aynı bilgileri. Önizleme ve PDF aynıdır. <b>Otomatik ve hazır yorumlar:</b> Gözlem sekmesinde her alanın altında <i>Veli görüşü (Ek-4’e yazılır)</i> alanı vardır; <i>Veli cevaplarından otomatik oluştur</i> düğmesi, velinin etkinlik anketi cevapları ve notundan kısa, profesyonel bir görüş yazar (düzenleyebilirsiniz; boş bırakırsanız velinin kendi notu yazılır). Öğretmen notu için <i>İşaretlere göre otomatik yaz</i> ve hazır cümle düğmeleri vardır. <i>Yapay Zeka</i> sekmesindeki <i>Hazır yorumlar — toplu</i> bölümü seçili öğrencilere (alan seçerek) ikisini birden yazar. Bu özellikler yapay zeka anahtarı gerektirmez. <b>Veli ekranında ne görünür?</b> Varsayılan olarak yalnızca <i>tarihi gelen</i> etkinlik (otomatik modda ayın 1–15 / 16–sonu; iki etkinlik aynı anda açıksa ikisi). Tablodaki <i>Veli ekranında</i> seçimiyle bir etkinliği <i>Her zaman göster</i> ya da <i>Gizle</i> yapabilirsiniz; <i>Otomatik</i> tarihe göre açar. Sıradaki etkinlik veliye tek satır olarak bildirilir; daha önce doldurulanlar “Önceki etkinliklerim” altında toplanır. <b>Veli formu etkinlik bazlıdır:</b> yıllık plandaki her etkinlik (1. dönem 8, 2. dönem 10) için veliye, çocuğunu evde/dışarıda gözleyeceği 3 soru, etkinliğin açıklaması ve evde yapabilecekleri gösterilir; form o etkinliğin tarih aralığında (otomatik modda ayın 1–15 / 16–sonu, yani ~15 gün) açılır. Veli sayfasında Ekim · 1 … Ocak · 2 sırasıyla tüm etkinlikler ve <i>Yaklaşan etkinlikler</i> görünür. Veli cevapları Gözlem sekmesinde <i>Veli evde gözlemi</i> olarak çıkar; Gelişti/Gelişiyor işaretlemesini siz yaparsınız. İdare, ek beceri sorularını <i>Veli formunda hangi sorular görünsün?</i> tablosundan <i>Veliye göster</i> ile ekleyebilir. Takvim satırlarındaki <i>Etkinlik raporu</i> yalnızca o etkinliği raporlar. <b>Veli girişlerini yönet:</b> veli bir bölümü <i>Bölümü gönder</i> ile gönderince o bölüm kilitlenir (veli ikinci kez dolduramaz). Aşağıdaki <i>Veli girişlerini yönet</i> kartından (ya da Gözlem sekmesinde bölümün altından) öğrenci, dönem ve alan seçip <i>Yeniden aç</i> (veli düzeltir) veya <i>Veli girişini sil</i> (veli cevap/notları silinir; sizin işaretlemeleriniz kalır) diyebilirsiniz. Deneme girişi yapılan öğrenci için <i>açık rıza onayını da sıfırla</i> kutusunu işaretleyin; gerçek veli rızayı yeniden verir. <b>Raporlar:</b> <i>Beceri alanı raporu</i> yalnızca seçilen alana (örn. İletişim ve Sosyal Beceriler), <i>Yıllık sınıf raporu</i> iki dönemin tamamına, <i>Sınıf değerlendirme raporu</i> bir döneme aittir.</p>`;
const KL_RIZA=`<h3>Açık rıza (KVKK)</h3><p>Veli sisteme ilk girdiğinde aydınlatma metnini okur, iki onay kutusunu işaretler ve <b>Onaylıyorum</b> der; onay tarih ve saatle kaydedilir. Onay verilmeden uygulamanın hiçbir bölümü açılmaz ve veli notu yazılamaz. <b>Raporlar</b> sekmesinden <i>Açık rıza belgesi</i> (tek öğrenci, imza alanlı), <i>Açık rıza onay listesi</i> (sınıf) ve idare/rehber için <i>Okul geneli açık rıza</i> raporu PDF olarak alınır. Veli <b>Yazdır</b> sekmesinden kendi belgesini alabilir ve rızasını geri çekebilir. Metin değişirse sürüm numarası artırılır ve veliler yeniden onay verir. <b>Not:</b> metin taslaktır; kullanmadan önce okulunuzun KVKK sorumlusu/ilçe milli eğitim müdürlüğü ve güncel mevzuatla karşılaştırılmalıdır.</p>`;
const KL_DEN=`<h3>Veli notlarını bölüm bölüm izleme</h3><p><b>Veli Takibi → Bölüm bölüm (tablo)</b>: satırlarda öğrenciler, sütunlarda beş bölüm bulunur; ✔ Dolu / ✖ Boş görünür. Altta her bölüm için doldurma ve doldurmama yüzdesi yer alır. Bir bölüm düğmesine dokunursanız yalnızca o bölümü doldurmayan veliler listelenir; tabloyu yazdırabilirsiniz.</p><h3>Öğretmen / gözlem denetimi</h3><p><b>Öğretmen Denetimi</b> (rehberde ve öğretmende <b>Gözlem Denetimi</b>) her sınıf ve öğretmen için beceri işaretlerinin yüzde kaçının yapıldığını, öğretmen notlarının doluluğunu ve hiç işaretlenmemiş öğrenci sayısını gösterir. Sınıfa dokunun: öğrenci × bölüm tablosunda hücre “işaretlenen/toplam” beceriyi gösterir; kırmızı hücre hiç işaretlenmediğini belirtir. <b>Yapay zekadan yorum al</b> tabloyu yorumlar ve öneri yazar; PDF olarak indirilebilir.</p><h3>Cihazda oturum</h3><p>Girişte “Bu cihazda beni hatırla” seçiliyse, <b>Çıkış</b> yapana kadar oturum açık kalır (60 güne kadar). Ortak cihazda bu kutuyu kaldırın ve işiniz bitince çıkış yapın.</p>`;
const KL_EK={
veli:`<h3>Yapay zeka ile not düzeltme</h3><p>“Gelişim Formum” sekmesinde her kategorinin veli notu kutusunun altında <b>Yapay zeka ile düzelt</b> düğmesi vardır. Önce notunuzu kendi cümlelerinizle yazın; düğmeye basınca yazım ve noktalama düzelir, cümleler akıcı olur. Yazdığınızın anlamı değişmez, yeni bilgi eklenmez. Metni beğenmezseniz <b>Önceki metne dön</b> ile geri alabilirsiniz. Yapay zekayı hiç kullanmadan elle de yazabilirsiniz. Çocuğunuzun adı dış servise gönderilmez.</p>`,
ogretmen:`<h3>Yapay zeka: seçili öğrencilere yorum ve soru-cevap</h3><p><b>Yapay Zeka Asistanı</b> sekmesinde sınıf listesi tıklanabilir. Öğrencileri tek tek işaretleyin ya da <b>Tümünü seç</b>, <b>Yorumsuzları seç</b> deyin; <b>Yorum yaz</b> düğmesi her öğrencinin notunu <b>kendi işaretlerine</b> göre yazar (olumlu işaretli öğrenciye olumlu, çok “Gelişiyor” işaretli öğrenciye gelişim odaklı). İsterseniz bir öğrencinin tonunu ve yönünü satırından değiştirin. Notu yazılmış öğrencilerde kırmızı <b>Yorum yapıldı</b> işareti görünür; üzerine yazma açılmadıkça tekrar yorum yazılmaz. Toplu işlemi tek düğmeyle geri alabilirsiniz. Aynı sekmede “Yapay zekaya sor” bölümünden sınıfınız hakkında soru sorabilir, PDF raporu alabilirsiniz.</p>`,
idare:`<h3>Yapay Zeka sekmesi</h3><p><b>Yapay Zeka</b> sekmesi okulun tüm sınıf, öğretmen ve öğrenci verisini bilir. “Hangi sınıfta veli notu en düşük?”, “Geciken etkinlikler neler?”, “Müdür için durum raporu yaz” gibi sorular sorabilirsiniz; yanıtı <b>PDF indir</b> ile resmî başlıklı rapora çevirir (Drive’a kaydedilir). Öğrenci ve öğretmen adları dış servise kodlanarak gider, yanıtta adlar geri yerleştirilir. Yapay zeka veri değiştirmez; plan, hesap ve not düzenlemeleri ilgili sekmelerden yapılır. Aynı sekmedeki <b>Metin düzeltici</b> duyuru ve notlarınızı düzgün cümlelere çevirir.</p>`,
rehber:`<h3>Yapay Zeka sekmesi</h3><p><b>Yapay Zeka</b> sekmesi risk düzeyi, veli katılımı ve gelişim verilerine dayanarak görüşme planı, rehberlik saati ve aile iletişimi önerileri üretir. Yanıtları PDF’e çevirebilir, <b>Metin düzeltici</b> ile görüşme notlarınızı resmî ve tarafsız bir dille düzeltebilirsiniz. Öneriler karar desteğidir, tanı değildir.</p>`};
